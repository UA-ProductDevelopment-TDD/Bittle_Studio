<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bittle Link</title>
<link rel="stylesheet" href="./base.css">
<link rel="stylesheet" href="./console.css">
<link rel="stylesheet" href="./serial-monitor.css">
</head>
<body>
<header>
  <div class="brand"><span class="brand-mark">B</span><div>Bittle Link<small>ROBOT CONSOLE</small></div></div>
  <div class="connection">
    <select id="transport" aria-label="Connection type"><option value="ble">Bluetooth BLE</option><option value="serial">Bluetooth / USB serial</option><option value="test">Test mode · no robot</option></select>
    <button id="connect" class="primary">Connect Bittle</button>
    <button id="disconnect" disabled>Disconnect</button>
    <label class="check" title="Sends gb on connect to turn off gyro/balance assistance; gB turns it back on."><input id="developerMode" type="checkbox" checked> Gyro off (developer mode)</label>
  </div>
</header>
<main>
  <section class="panel"><div id="console"></div></section>
  <section class="panel">
    <details open><summary>Serial monitor</summary>
      <div id="serialMonitor" class="serial-standalone"></div>
    </details>
  </section>
</main>
<dialog id="importDialog" aria-labelledby="importTitle">
  <div class="dialog-head"><h2 id="importTitle">Import a pack</h2><button type="button" data-close aria-label="Close">×</button></div>
  <p class="note">Packs in the <code>saved-motions</code> folder. Bittle Studio saves there with <b>Console → Save pack</b>.</p>
  <div id="packList" class="pack-list"></div>
  <div class="dialog-foot"><button type="button" id="importFile">From another file…</button></div>
</dialog>
<div id="toast" role="status"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
